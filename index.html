<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tim Jembatan Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body { background-color: #030305; color: #f3f4f6; overflow-x: hidden; font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    .neon-border { box-shadow: 0 0 15px rgba(255, 0, 51, 0.25), inset 0 0 15px rgba(255, 0, 51, 0.1); border: 1px solid rgba(255, 0, 51, 0.4); }
    .neon-text { text-shadow: 0 0 20px rgba(255, 0, 51, 0.8), 0 0 40px rgba(255, 0, 51, 0.4); }
    /* Custom Scrollbar untuk Chat */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    ::-webkit-scrollbar-thumb { background: rgba(255,0,51,0.3); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,0,51,0.6); }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative selection:bg-red-600 selection:text-white">

  <!-- Background Wind Animation Canvas -->
  <canvas id="windCanvas" class="fixed inset-0 pointer-events-none z-0"></canvas>

  <!-- Navigation Bar -->
  <header class="relative z-10 border-b border-white/10 bg-black/60 backdrop-blur-md px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-3 h-3 rounded-full bg-red-600 animate-pulse shadow-[0_0_10px_#ff0033]"></div>
      <span class="font-orbitron font-bold tracking-wider text-xl text-white">TIM JEMBATAN</span>
    </div>
    <div id="userProfileDisplay" class="hidden text-xs font-mono text-gray-300 bg-white/5 border border-white/10 px-3 py-1.5 rounded-full flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
      <span id="currentUserName">User</span>
    </div>
  </header>

  <!-- Login Gate Screen -->
  <div id="authGate" class="relative z-20 flex-1 flex items-center justify-center p-4">
    <div class="w-full max-w-md neon-border bg-black/80 backdrop-blur-xl rounded-2xl p-8 text-center space-y-6">
      <div>
        <h1 class="font-orbitron font-black text-2xl text-white tracking-widest">TIM JEMBATAN</h1>
        <p class="text-xs text-gray-400 mt-1">Pilih profil dan masukkan password</p>
      </div>

      <form id="loginForm" class="space-y-4 text-left">
        <!-- Pilih Nama Anggota -->
        <div>
          <label class="text-xs font-mono text-gray-400 block mb-1">Pilih Anggota</label>
          <select id="memberSelect" class="w-full bg-black/80 border border-white/20 rounded-xl px-4 py-3 text-white font-mono text-sm focus:outline-none focus:border-red-600 transition" required>
            <option value="" disabled selected>-- Pilih Nama Anda --</option>
            <option value="Danish (ridellazor)">Danish (ridellazor)</option>
            <option value="Danish">Danish</option>
            <option value="Ibrahim">Ibrahim</option>
            <option value="Alvierro">Alvierro</option>
          </select>
        </div>

        <div>
          <label class="text-xs font-mono text-gray-400 block mb-1">Password</label>
          <input 
            type="password" 
            id="passcodeInput" 
            placeholder="Masukkan Password..." 
            class="w-full bg-black/80 border border-white/20 rounded-xl px-4 py-3 text-white font-mono placeholder:text-gray-600 focus:outline-none focus:border-red-600 transition text-sm"
            required
            autocomplete="current-password"
          />
        </div>
        <p id="errorMsg" class="text-xs text-red-500 font-mono hidden text-center">Pilih nama atau password salah.</p>
        <button 
          type="submit" 
          class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl transition shadow-[0_0_20px_rgba(255,0,51,0.4)] tracking-wider text-sm mt-2">
          Login
        </button>
      </form>
    </div>
  </div>

  <!-- Main Authenticated Content -->
  <main id="mainContent" class="hidden relative z-10 flex-1 flex flex-col items-center justify-center px-4 py-8">
    <div class="max-w-5xl mx-auto flex flex-col items-center w-full space-y-6">
      
      <h1 class="font-orbitron font-black text-3xl md:text-5xl tracking-tight text-white neon-text text-center">
        TIM JEMBATAN
      </h1>

      <!-- Grid Dashboard: Absensi, Kehadiran, & Chat -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 w-full">
        
        <!-- Kolom 1: Absensi Pribadi -->
        <div class="bg-neutral-900/80 border border-white/10 rounded-2xl p-5 backdrop-blur-md shadow-lg flex flex-col justify-between">
          <div>
            <div class="flex justify-between items-center mb-3 border-b border-white/10 pb-2">
              <span class="text-xs font-mono text-gray-400">ABSENSI SAYA</span>
              <span id="clockStatusBadge" class="text-xs font-mono px-2 py-0.5 rounded bg-yellow-500/10 text-yellow-400 border border-yellow-500/30">BELUM ABSEN</span>
            </div>
            <div class="text-center my-3">
              <div id="clockDisplay" class="font-orbitron text-xl font-bold text-white tracking-wider">--:--:--</div>
              <p id="clockInfo" class="text-xs text-gray-400 mt-1">Absen saat selesai kegiatan.</p>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2 mt-4">
            <button id="btnClockIn" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-3 rounded-xl text-xs transition shadow-[0_0_10px_rgba(16,185,129,0.3)]">
              Absen Masuk
            </button>
            <button id="btnClockOut" class="bg-red-600/40 hover:bg-red-600 text-white font-bold py-2 px-3 rounded-xl text-xs transition border border-red-500/30 cursor-not-allowed" disabled>
              Keluar Sesi
            </button>
          </div>
        </div>

        <!-- Kolom 2: Daftar Hadir Rekan Tim -->
        <div class="bg-neutral-900/80 border border-white/10 rounded-2xl p-5 backdrop-blur-md shadow-lg flex flex-col">
          <div class="flex justify-between items-center mb-3 border-b border-white/10 pb-2">
            <span class="text-xs font-mono text-gray-400">KEHADIRAN TIM</span>
            <span id="attendanceCount" class="text-xs font-mono text-emerald-400">0 Hadir</span>
          </div>
          <div id="attendanceList" class="flex-1 overflow-y-auto max-h-[130px] space-y-2 pr-1 text-xs font-mono">
            <p class="text-gray-500 text-center italic py-6">Belum ada yang absen.</p>
          </div>
        </div>

        <!-- Kolom 3: Live Team Chat -->
        <div class="bg-neutral-900/80 border border-white/10 rounded-2xl p-5 backdrop-blur-md shadow-lg flex flex-col justify-between h-[230px] md:h-auto">
          <div class="flex justify-between items-center mb-2 border-b border-white/10 pb-2">
            <span class="text-xs font-mono text-gray-400">TIM CHAT</span>
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          </div>
          
          <!-- Box Pesan Chat -->
          <div id="chatMessages" class="flex-1 overflow-y-auto space-y-2 pr-1 text-xs font-mono my-2">
            <p class="text-gray-500 text-center italic py-4">Belum ada pesan.</p>
          </div>

          <!-- Input Form Chat -->
          <form id="chatForm" class="flex gap-2 mt-1">
            <input 
              type="text" 
              id="chatInput" 
              placeholder="Tulis pesan..." 
              class="flex-1 bg-black/60 border border-white/10 rounded-xl px-3 py-2 text-xs font-mono text-white focus:outline-none focus:border-red-600 transition"
              required
            />
            <button type="submit" class="bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded-xl text-xs font-bold transition shadow-[0_0_10px_rgba(255,0,51,0.3)]">
              Kirim
            </button>
          </form>
        </div>

      </div>

      <!-- Voxel Bridge Canvas -->
      <div class="w-full max-w-[800px] overflow-hidden flex justify-center my-1">
        <canvas id="bridgeCanvas" width="1000" height="220" class="w-full h-auto max-h-[180px]"></canvas>
      </div>

      <div class="flex gap-4">
        <button id="btnLogout" class="bg-white/10 hover:bg-white/20 border border-white/20 text-xs font-mono text-gray-300 py-2 px-5 rounded-xl transition">
          LOG OUT
        </button>
      </div>
    </div>
  </main>

  <footer class="relative z-10 py-4"></footer>

  <script>
    // --- SECURE HASH VERIFICATION MODULE ---
    // Load password from password.txt and compute hash
    let TARGET_HASH = null;
    let passwordLoaded = false;

    // Fetch password from password.txt
    async function loadPasswordHash() {
      try {
        const response = await fetch('password.txt');
        const passwordText = await response.text();
        const password = passwordText.trim();
        
        // Compute SHA-256 hash of the password
        const encoder = new TextEncoder();
        const data = encoder.encode(password);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        TARGET_HASH = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        
        passwordLoaded = true;
        console.log("Password loaded and hashed successfully");
      } catch (err) {
        console.error("Failed to load password:", err);
        // Fallback to default hash if loading fails
        TARGET_HASH = "f2095f3ff808ebba2dd4ed7aaed240b64d1f2719ec20f18bdce66d2f34731a54";
        passwordLoaded = true;
      }
    }

    async function verifyPassword(password) {
      // Ensure password is loaded before verifying
      if (!passwordLoaded) {
        await loadPasswordHash();
      }
      
      try {
        const encoder = new TextEncoder();
        const data = encoder.encode(password);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        const hashedInput = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        console.log("Computed hash:", hashedInput);
        console.log("Target hash:", TARGET_HASH);
        return hashedInput === TARGET_HASH;
      } catch (err) {
        console.error("Auth error:", err);
        return false;
      }
    }

    // Load password on page load
    loadPasswordHash();

    const GITHUB_STORAGE = {
      owner: 'danishtesting4',
      repo: 'Jembuatan',
      branch: 'main',
      path: 'shared-data.json',
      tokenKey: 'tj_github_token'
    };

    function decodeBase64Content(content) {
      const normalized = content.replace(/\n/g, '');
      const binary = atob(normalized);
      return decodeURIComponent(
        Array.from(binary, char => '%' + ('00' + char.charCodeAt(0).toString(16)).slice(-2)).join('')
      );
    }

    function getGitHubToken() {
      const existing = sessionStorage.getItem(GITHUB_STORAGE.tokenKey);
      if (existing) return existing;

      const entered = prompt('Masukkan GitHub Personal Access Token (PAT) untuk menyimpan data absensi/chat di repo ini. Token hanya dipakai di browser ini dan tidak disimpan di repo.');
      if (!entered || !entered.trim()) return null;

      const token = entered.trim();
      sessionStorage.setItem(GITHUB_STORAGE.tokenKey, token);
      return token;
    }

    async function readGitHubState() {
      const defaultState = {
        attendance: { date: new Date().toISOString().split('T')[0], list: {} },
        chat: []
      };

      try {
        const response = await fetch(
          `https://api.github.com/repos/${GITHUB_STORAGE.owner}/${GITHUB_STORAGE.repo}/contents/${GITHUB_STORAGE.path}?ref=${GITHUB_STORAGE.branch}`,
          {
            headers: {
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28'
            }
          }
        );

        if (!response.ok) {
          return defaultState;
        }

        const file = await response.json();
        if (!file || !file.content) {
          return defaultState;
        }

        const parsed = JSON.parse(decodeBase64Content(file.content));
        return {
          attendance: parsed.attendance || { date: new Date().toISOString().split('T')[0], list: {} },
          chat: Array.isArray(parsed.chat) ? parsed.chat : []
        };
      } catch (error) {
        console.warn('Gagal membaca state GitHub, memakai default:', error);
        return defaultState;
      }
    }

    async function writeGitHubState(state) {
      const token = getGitHubToken();
      if (!token) {
        throw new Error('GitHub PAT belum diisi. Masukkan token untuk menyimpan data absensi dan chat.');
      }

      const fileUrl = `https://api.github.com/repos/${GITHUB_STORAGE.owner}/${GITHUB_STORAGE.repo}/contents/${GITHUB_STORAGE.path}?ref=${GITHUB_STORAGE.branch}`;
      let sha = null;

      try {
        const existing = await fetch(fileUrl, {
          headers: {
            'Accept': 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
            'Authorization': `Bearer ${token}`
          }
        });

        if (existing.ok) {
          const existingFile = await existing.json();
          sha = existingFile.sha;
        }
      } catch (error) {
        console.warn('Tidak bisa membaca file yang ada, mungkin file baru.', error);
      }

      const payload = JSON.stringify(state, null, 2);
      const encoded = btoa(unescape(encodeURIComponent(payload)));

      const response = await fetch(`https://api.github.com/repos/${GITHUB_STORAGE.owner}/${GITHUB_STORAGE.repo}/contents/${GITHUB_STORAGE.path}`, {
        method: 'PUT',
        headers: {
          'Accept': 'application/vnd.github+json',
          'X-GitHub-Api-Version': '2022-11-28',
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: `Update attendance and chat ${new Date().toISOString()}`,
          branch: GITHUB_STORAGE.branch,
          content: encoded,
          ...(sha ? { sha } : {})
        })
      });

      if (!response.ok) {
        const text = await response.text();
        throw new Error(text || 'Write to GitHub failed');
      }

      return response.json();
    }

    // --- UI & Auth Flow ---
    const authGate = document.getElementById('authGate');
    const mainContent = document.getElementById('mainContent');
    const loginForm = document.getElementById('loginForm');
    const passInput = document.getElementById('passcodeInput');
    const memberSelect = document.getElementById('memberSelect');
    const errorMsg = document.getElementById('errorMsg');
    const btnLogout = document.getElementById('btnLogout');
    const currentUserNameDisplay = document.getElementById('currentUserName');
    const userProfileDisplay = document.getElementById('userProfileDisplay');

    let activeUser = sessionStorage.getItem('tj_active_user');

    if (sessionStorage.getItem('tj_secure_auth') === 'true' && activeUser) {
      unlockPortal(activeUser);
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const selectedMember = memberSelect.value;
      const isValid = await verifyPassword(passInput.value);

      console.log("Login attempt - Member:", selectedMember, "Valid:", isValid);

      if (isValid && selectedMember) {
        errorMsg.classList.add('hidden');
        activeUser = selectedMember;
        sessionStorage.setItem('tj_secure_auth', 'true');
        sessionStorage.setItem('tj_active_user', activeUser);
        unlockPortal(activeUser);
      } else {
        errorMsg.classList.remove('hidden');
        passInput.value = '';
      }
    });

    btnLogout.addEventListener('click', () => {
      sessionStorage.removeItem('tj_secure_auth');
      sessionStorage.removeItem('tj_active_user');
      location.reload();
    });

    function unlockPortal(username) {
      authGate.classList.add('hidden');
      mainContent.classList.remove('hidden');
      userProfileDisplay.classList.remove('hidden');
      currentUserNameDisplay.textContent = username;
      initBridgeCanvas();
      initClockSystem(username);
      initChatSystem(username);
    }

    // --- Shared Attendance System ---
    async function initClockSystem(username) {
      const clockDisplay = document.getElementById('clockDisplay');
      const clockStatusBadge = document.getElementById('clockStatusBadge');
      const clockInfo = document.getElementById('clockInfo');
      const btnClockIn = document.getElementById('btnClockIn');
      const btnClockOut = document.getElementById('btnClockOut');
      const attendanceList = document.getElementById('attendanceList');
      const attendanceCount = document.getElementById('attendanceCount');

      setInterval(() => {
        const now = new Date();
        clockDisplay.textContent = now.toTimeString().split(' ')[0];
      }, 1000);

      const todayStr = new Date().toISOString().split('T')[0];

      let records = { date: todayStr, list: {} };

      function syncBoardFromRemote() {
        return readGitHubState().then((state) => {
          const remoteRecords = state.attendance || { date: todayStr, list: {} };
          if (remoteRecords.date && remoteRecords.date !== todayStr) {
            records = { date: todayStr, list: {} };
          } else if (!remoteRecords.date) {
            records = { date: todayStr, list: {} };
          } else {
            records = remoteRecords;
          }

          const me = records.list[username];
          if (me && me.status === 'active') {
            setClockedInState(me.time);
          } else {
            clockStatusBadge.textContent = 'BELUM ABSEN';
            clockStatusBadge.className = 'text-xs font-mono px-2 py-0.5 rounded bg-yellow-500/10 text-yellow-400 border border-yellow-500/30';
            clockInfo.textContent = 'Absen saat selesai kegiatan.';
            btnClockIn.disabled = false;
            btnClockIn.className = 'bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-3 rounded-xl text-xs transition shadow-[0_0_10px_rgba(16,185,129,0.3)]';
            btnClockOut.disabled = true;
            btnClockOut.className = 'bg-red-600/40 text-white font-bold py-2 px-3 rounded-xl text-xs transition border border-red-500/30 cursor-not-allowed';
          }

          updateAttendanceBoard(records.list);
        }).catch((error) => {
          console.warn('Tidak dapat sinkronisasi board:', error);
        });
      }

      await syncBoardFromRemote();
      setInterval(() => {
        syncBoardFromRemote();
      }, 5000);

      btnClockIn.addEventListener('click', async () => {
        try {
          const state = await readGitHubState();
          const existing = state.attendance || { date: todayStr, list: {} };
          existing.date = todayStr;
          existing.list[username] = { time: new Date().toLocaleTimeString(), status: 'active' };
          state.attendance = existing;
          await writeGitHubState(state);
          records = existing;
          setClockedInState(existing.list[username].time);
          updateAttendanceBoard(records.list);
        } catch (error) {
          console.error('Clock-in failed:', error);
          alert(error.message || 'Gagal menyimpan absen masuk ke GitHub.');
        }
      });

      btnClockOut.addEventListener('click', async () => {
        try {
          const state = await readGitHubState();
          const existing = state.attendance || { date: todayStr, list: {} };
          existing.date = todayStr;
          if (existing.list[username]) {
            existing.list[username].status = 'completed';
          }
          state.attendance = existing;
          await writeGitHubState(state);
          records = existing;

          clockStatusBadge.textContent = 'SELESAI';
          clockStatusBadge.className = 'text-xs font-mono px-2 py-0.5 rounded bg-gray-500/10 text-gray-400 border border-gray-500/30';
          clockInfo.textContent = 'Sesi ditutup.';
          
          btnClockIn.disabled = false;
          btnClockIn.className = 'bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-3 rounded-xl text-xs transition shadow-[0_0_10px_rgba(16,185,129,0.3)]';
          
          btnClockOut.disabled = true;
          btnClockOut.className = 'bg-red-600/40 text-white font-bold py-2 px-3 rounded-xl text-xs transition border border-red-500/30 cursor-not-allowed';

          updateAttendanceBoard(records.list);
        } catch (error) {
          console.error('Clock-out failed:', error);
          alert(error.message || 'Gagal menyimpan absen keluar ke GitHub.');
        }
      });

      function setClockedInState(timeStr) {
        clockStatusBadge.textContent = 'AKTIF';
        clockStatusBadge.className = 'text-xs font-mono px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/30';
        clockInfo.textContent = `Absen pukul ${timeStr}`;
        
        btnClockIn.disabled = true;
        btnClockIn.className = 'bg-emerald-600/40 text-white font-bold py-2 px-3 rounded-xl text-xs transition cursor-not-allowed';
        
        btnClockOut.disabled = false;
        btnClockOut.className = 'bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-3 rounded-xl text-xs transition shadow-[0_0_10px_rgba(255,0,51,0.3)] cursor-pointer';
      }

      function updateAttendanceBoard(list) {
        attendanceList.innerHTML = '';
        const entries = Object.entries(list);
        
        if (entries.length === 0) {
          attendanceList.innerHTML = '<p class="text-gray-500 text-center italic py-6">Belum ada yang absen.</p>';
          attendanceCount.textContent = '0 Hadir';
          return;
        }

        let count = 0;
        entries.forEach(([name, data]) => {
          count++;
          const item = document.createElement('div');
          item.className = 'flex justify-between items-center bg-black/40 border border-white/5 px-2.5 py-1.5 rounded-lg';
          item.innerHTML = `
            <span class="text-white font-bold">${name}</span>
            <div class="flex items-center gap-2">
              <span class="text-gray-400 text-[10px]">${data.time}</span>
              <span class="px-1.5 py-0.5 rounded text-[9px] ${data.status === 'active' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-gray-700/30 text-gray-400'}">
                ${data.status === 'active' ? 'Hadir' : 'Selesai'}
              </span>
            </div>
          `;
          attendanceList.appendChild(item);
        });
        attendanceCount.textContent = `${count} Hadir`;
      }
    }

    // --- Live Team Chat System ---
    async function initChatSystem(username) {
      const chatMessages = document.getElementById('chatMessages');
      const chatForm = document.getElementById('chatForm');
      const chatInput = document.getElementById('chatInput');

      async function loadMessages() {
        const state = await readGitHubState();
        const msgs = Array.isArray(state.chat) ? state.chat : [];
        chatMessages.innerHTML = '';

        if (msgs.length === 0) {
          chatMessages.innerHTML = '<p class="text-gray-500 text-center italic py-4">Belum ada pesan.</p>';
          return;
        }

        msgs.forEach(msg => {
          const div = document.createElement('div');
          div.className = `p-2 rounded-lg bg-black/40 border ${msg.user === username ? 'border-red-600/30' : 'border-white/5'}`;
          div.innerHTML = `
            <div class="flex justify-between items-center text-[10px] text-gray-400 mb-1">
              <span class="font-bold text-red-500">${msg.user}</span>
              <span>${msg.time}</span>
            </div>
            <p class="text-white text-xs break-words">${msg.text}</p>
          `;
          chatMessages.appendChild(div);
        });
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = chatInput.value.trim();
        if (!text) return;

        try {
          const state = await readGitHubState();
          const msgs = Array.isArray(state.chat) ? state.chat : [];
          const now = new Date();
          const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

          msgs.push({ user: username, text: text, time: timeStr });
          if (msgs.length > 50) msgs.shift();

          state.chat = msgs;
          await writeGitHubState(state);
          chatInput.value = '';
          await loadMessages();
        } catch (error) {
          console.error('Chat save failed:', error);
          alert(error.message || 'Gagal menyimpan chat ke GitHub.');
        }
      });

      setInterval(() => {
        loadMessages().catch((error) => console.warn('Gagal refresh chat:', error));
      }, 5000);

      await loadMessages();
    }

    // --- Wind Background Animation ---
    const canvas = document.getElementById('windCanvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const lines = Array.from({ length: 70 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      length: Math.random() * 90 + 40,
      speed: Math.random() * 3.5 + 2,
      opacity: Math.random() * 0.4 + 0.1
    }));

    function animateWind() {
      ctx.clearRect(0, 0, width, height);
      lines.forEach(line => {
        line.x += line.speed;
        if (line.x > width) {
          line.x = -line.length;
          line.y = Math.random() * height;
        }
        const grad = ctx.createLinearGradient(line.x, line.y, line.x + line.length, line.y);
        grad.addColorStop(0, 'rgba(255, 0, 51, 0)');
        grad.addColorStop(0.5, `rgba(255, 0, 51, ${line.opacity})`);
        grad.addColorStop(1, 'rgba(255, 0, 51, 0)');

        ctx.beginPath();
        ctx.strokeStyle = grad;
        ctx.lineWidth = Math.random() * 1.5 + 0.5;
        ctx.moveTo(line.x, line.y);
        ctx.lineTo(line.x + line.length, line.y);
        ctx.stroke();
      });
      requestAnimationFrame(animateWind);
    }
    animateWind();

    // --- Voxel Bridge Rendering ---
    function initBridgeCanvas() {
      const bCanvas = document.getElementById('bridgeCanvas');
      if (!bCanvas) return;
      const bCtx = bCanvas.getContext('2d');
      const BLOCK_SIZE = 16;
      const blocks = 200;
      let offset = 0;

      function drawBridge() {
        bCtx.fillStyle = '#030305';
        bCtx.fillRect(0, 0, bCanvas.width, bCanvas.height);

        for (let i = 0; i < blocks; i++) {
          const x = ((i * BLOCK_SIZE) - offset) % (blocks * BLOCK_SIZE);
          const y = bCanvas.height / 2 - BLOCK_SIZE / 2;
          
          const hue = (i * 2 + offset) % 360;
          bCtx.fillStyle = `hsl(${hue}, 100%, 50%)`;
          bCtx.fillRect(x, y, BLOCK_SIZE - 2, BLOCK_SIZE - 2);
          
          bCtx.strokeStyle = 'rgba(255, 0, 51, 0.3)';
          bCtx.lineWidth = 1;
          bCtx.strokeRect(x, y, BLOCK_SIZE - 2, BLOCK_SIZE - 2);
        }

        offset += 2;
        requestAnimationFrame(drawBridge);
      }

      drawBridge();
    }
  </script>
</body>
