<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migrasi untuk Tim Jembatan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;800;900&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #030305;
            color: #ffffff;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        /* Red glow for Tim Jembatan text */
        .glow-red {
            color: #ff2a2a;
            text-shadow: 0 0 20px rgba(255, 42, 42, 0.9),
                         0 0 45px rgba(255, 42, 42, 0.6),
                         0 0 80px rgba(220, 0, 0, 0.4);
        }

        .gentle-float {
            animation: float 4s ease-in-out infinite alternate;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-8px); }
        }
    </style>
</head>
<body class="bg-black text-white h-screen w-screen relative flex items-center justify-center select-none overflow-hidden">

    <canvas id="windCanvas" class="absolute inset-0 w-full h-full z-0 pointer-events-none"></canvas>

    <div class="z-10 flex flex-col items-center justify-center px-6 text-center gentle-float w-full max-w-6xl mx-auto">
        
        <!-- Balanced, highly readable heading -->
        <h1 class="text-4xl sm:text-6xl md:text-7xl lg:text-8xl font-black tracking-tight leading-tight mb-2">
            Migrasi untuk <span class="glow-red inline-block">Tim Jembatan</span>
        </h1>

        <!-- Compact Block Bridge directly underneath -->
        <div class="w-full flex justify-center items-center mt-2">
            <canvas id="bridgeCanvas" class="w-full max-w-[900px] h-auto drop-shadow-[0_10px_30px_rgba(255,42,42,0.4)]"></canvas>
        </div>

    </div>

    <script>
        const windCanvas = document.getElementById('windCanvas');
        const wCtx = windCanvas.getContext('2d');

        let wWidth, wHeight;

        function resizeWind() {
            wWidth = windCanvas.width = window.innerWidth;
            wHeight = windCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeWind);
        resizeWind();

        class WindParticle {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.x = initial ? Math.random() * wWidth : -200 - Math.random() * 300;
                this.y = Math.random() * wHeight;
                this.length = Math.random() * 220 + 100;
                this.speed = Math.random() * 8 + 5;
                this.opacity = Math.random() * 0.45 + 0.15;
                this.thickness = Math.random() * 3 + 1;
                this.isRed = Math.random() < 0.35;
            }

            update() {
                this.x += this.speed;
                if (this.x - this.length > wWidth) {
                    this.reset();
                }
            }

            draw() {
                wCtx.beginPath();
                const grad = wCtx.createLinearGradient(this.x - this.length, this.y, this.x, this.y);
                
                if (this.isRed) {
                    grad.addColorStop(0, 'rgba(255, 42, 42, 0)');
                    grad.addColorStop(0.8, `rgba(255, 42, 42, ${this.opacity})`);
                    grad.addColorStop(1, 'rgba(255, 120, 120, 0)');
                } else {
                    grad.addColorStop(0, 'rgba(255, 255, 255, 0)');
                    grad.addColorStop(0.8, `rgba(220, 225, 255, ${this.opacity * 0.6})`);
                    grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
                }

                wCtx.strokeStyle = grad;
                wCtx.lineWidth = this.thickness;
                wCtx.lineCap = 'round';
                wCtx.moveTo(this.x - this.length, this.y);
                wCtx.lineTo(this.x, this.y);
                wCtx.stroke();
            }
        }

        const windParticles = Array.from({ length: 70 }, () => new WindParticle());

        function animateWind() {
            wCtx.clearRect(0, 0, wWidth, wHeight);
            windParticles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateWind);
        }

        const bCanvas = document.getElementById('bridgeCanvas');
        const bCtx = bCanvas.getContext('2d');

        bCanvas.width = 1000;
        bCanvas.height = 200;

        const BLOCK_SIZE = 18;

        function draw3DBlock(ctx, x, y, size, type = 'red') {
            const h = size * 0.85;

            let topColor, frontColor, sideColor, outlineColor;

            if (type === 'red') {
                topColor = '#ff3333';
                frontColor = '#cc0000';
                sideColor = '#770000';
                outlineColor = '#ff8080';
            } else if (type === 'dark') {
                topColor = '#4a4a52';
                frontColor = '#2b2b32';
                sideColor = '#18181e';
                outlineColor = '#686875';
            } else if (type === 'gold') {
                topColor = '#ffcc00';
                frontColor = '#d99b00';
                sideColor = '#805b00';
                outlineColor = '#ffe680';
            }

            // Front face
            ctx.fillStyle = frontColor;
            ctx.fillRect(x, y + size * 0.3, size, h);

            // Top face
            ctx.fillStyle = topColor;
            ctx.beginPath();
            ctx.moveTo(x, y + size * 0.3);
            ctx.lineTo(x + size * 0.35, y);
            ctx.lineTo(x + size * 1.35, y);
            ctx.lineTo(x + size, y + size * 0.3);
            ctx.closePath();
            ctx.fill();

            // Right side face
            ctx.fillStyle = sideColor;
            ctx.beginPath();
            ctx.moveTo(x + size, y + size * 0.3);
            ctx.lineTo(x + size * 1.35, y);
            ctx.lineTo(x + size * 1.35, y + h);
            ctx.lineTo(x + size, y + size * 0.3 + h);
            ctx.closePath();
            ctx.fill();

            // Highlight border
            ctx.strokeStyle = outlineColor;
            ctx.lineWidth = 1;
            ctx.strokeRect(x, y + size * 0.3, size, h);
        }

        function drawBridge() {
            bCtx.clearRect(0, 0, bCanvas.width, bCanvas.height);

            const startX = 30;
            const deckY = 120;
            const totalCols = 48;

            // 1. Support Pillars
            const pillarPositions = [5, 16, 27, 38, 46];
            pillarPositions.forEach(pCol => {
                const px = startX + pCol * BLOCK_SIZE;
                for (let py = deckY + BLOCK_SIZE; py < deckY + (BLOCK_SIZE * 3.5); py += BLOCK_SIZE * 0.85) {
                    draw3DBlock(bCtx, px, py, BLOCK_SIZE, 'dark');
                }
            });

            // 2. Main Deck
            for (let c = 0; c < totalCols; c++) {
                const px = startX + c * BLOCK_SIZE;
                draw3DBlock(bCtx, px, deckY, BLOCK_SIZE, 'red');
            }

            // 3. Guard Rails
            for (let c = 0; c < totalCols; c++) {
                if (c % 2 === 0) {
                    const px = startX + c * BLOCK_SIZE;
                    draw3DBlock(bCtx, px, deckY - BLOCK_SIZE * 0.85, BLOCK_SIZE * 0.8, 'gold');
                }
            }

            // 4. Twin Towers
            const towers = [11, 35];
            towers.forEach(tCol => {
                const tx = startX + tCol * BLOCK_SIZE;
                for (let h = 1; h <= 6; h++) {
                    draw3DBlock(bCtx, tx, deckY - (h * BLOCK_SIZE * 0.85), BLOCK_SIZE, 'red');
                    draw3DBlock(bCtx, tx + BLOCK_SIZE, deckY - (h * BLOCK_SIZE * 0.85), BLOCK_SIZE, 'red');
                }
                draw3DBlock(bCtx, tx, deckY - (6.8 * BLOCK_SIZE * 0.85), BLOCK_SIZE, 'gold');
                draw3DBlock(bCtx, tx + BLOCK_SIZE, deckY - (6.8 * BLOCK_SIZE * 0.85), BLOCK_SIZE, 'gold');
            });

            // 5. Suspension Cables
            for (let c = 0; c < totalCols; c++) {
                const px = startX + c * BLOCK_SIZE;
                let cableY = deckY - (BLOCK_SIZE * 5) + Math.pow(c - 23, 2) * 0.17;
                if (cableY < deckY - BLOCK_SIZE * 0.3) {
                    draw3DBlock(bCtx, px, cableY, BLOCK_SIZE * 0.6, 'gold');
                }
            }
        }

        window.onload = function () {
            animateWind();
            drawBridge();
        };
    </script>
</body>
</html>
